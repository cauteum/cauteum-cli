# gogpu-style CI: format, lint, cross-platform build + test
name: CI

env:
  CGO_ENABLED: "0"
  GOWORK: ${{ github.workspace }}/go.work

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write  # Codecov OIDC

jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cauteum-cli
    steps:

      - name: Checkout cauteum-cli
        uses: actions/checkout@v4
        with:
          path: cauteum-cli

      - name: Checkout cauteum-core
        uses: actions/checkout@v4
        with:
          repository: cauteum/cauteum-core
          path: cauteum-core
          ref: 9b32ff965beffcaadaa6361630b9d821370a564c

      - name: Checkout cauteum-display
        uses: actions/checkout@v4
        with:
          repository: cauteum/cauteum-display
          path: cauteum-display
          ref: e082e41bf28aa124193fee946e84c65ac1e5c3cb

      - name: Checkout cauteum-driver
        uses: actions/checkout@v4
        with:
          repository: cauteum/cauteum-driver
          path: cauteum-driver
          ref: 6e20cf9b7a483a2b92144e821ffcc68e4cb5cebe

      - name: Checkout cauteum-providers
        uses: actions/checkout@v4
        with:
          repository: cauteum/cauteum-providers
          path: cauteum-providers
          ref: 1b3297f6bfe9bc3d1e3363726f7748fb736a14a8

      - name: Checkout cauteum-proxy
        uses: actions/checkout@v4
        with:
          repository: cauteum/cauteum-proxy
          path: cauteum-proxy
          ref: e0620208414a87b38d8f4420a9ceed73e6a02466

      - name: Checkout cauteum-runtime
        uses: actions/checkout@v4
        with:
          repository: cauteum/cauteum-runtime
          path: cauteum-runtime
          ref: 080a573fb5cdb46a69cf2cddb38e92bf0757c063

      - name: Checkout cauteum-sdk
        uses: actions/checkout@v4
        with:
          repository: cauteum/cauteum-sdk
          path: cauteum-sdk
          ref: 5343d7c5d8b76e900fc5b439c074cd3445756606

      - name: Checkout cauteum-gateway Control API
        uses: actions/checkout@v4
        with:
          repository: cauteum/cauteum-gateway
          path: cauteum-gateway
          ref: b3d30c1a0375383cd851fcaa9041fde9621401d8

      - name: Checkout slogx
        uses: actions/checkout@v4
        with:
          repository: cauteum/slogx
          path: slogx
      - name: Write go.work
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'go 1.27.0'
            echo 'use ('
            for d in cauteum-* slogx; do
              if [[ -d "$d" ]]; then
                echo "  ./$d"
              fi
            done
            echo ')'
            echo 'replace ('
            for d in cauteum-*; do
              if [[ -d "$d" ]]; then
                echo "  github.com/cauteum/${d} v0.1.0-alpha.1 => ./$d"
                echo "  github.com/cauteum/${d} v0.1.0-alpha.2 => ./$d"
                echo "  github.com/cauteum/${d} v0.1.0-beta.1 => ./$d"
                echo "  github.com/cauteum/${d} v0.1.0-beta.2 => ./$d"
              fi
            done
            if [[ -d slogx ]]; then
              echo '  github.com/cauteum/slogx v0.1.0-alpha.1 => ./slogx'
              echo '  github.com/cauteum/slogx v0.1.0-alpha.2 => ./slogx'
              echo '  github.com/cauteum/slogx v0.1.0-beta.1 => ./slogx'
              echo '  github.com/cauteum/slogx v0.1.0-beta.2 => ./slogx'
            fi
            echo ')'
          } > "${{ github.workspace }}/go.work"
          echo "Wrote go.work:" && cat "${{ github.workspace }}/go.work"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache: true
          cache-dependency-path: |
            cauteum-*/go.sum
            slogx/go.sum
      - name: Check gofmt
        run: |
          set -euo pipefail
          bad="$(gofmt -l .)"
          if [[ -n "$bad" ]]; then
            echo "ERROR: not formatted:"
            echo "$bad"
            exit 1
          fi
          echo "gofmt: ok"

